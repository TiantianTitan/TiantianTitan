<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes data-flow { to { stroke-dashoffset: -180; } }
    @keyframes cursor-blink { 0%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
    @keyframes node-pulse { 0% { transform: scale(.35); opacity: .5; } 80%, 100% { transform: scale(1.25); opacity: 0; } }
    @keyframes core-breathe { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes status-breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; filter: drop-shadow(0 0 4px #8BFFB0); } }
    @keyframes underline-scan { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .signal { stroke-dasharray: 18 14; animation: data-flow 8s linear infinite; }
    .signal-reverse { animation-direction: reverse; animation-duration: 10s; }
    .cursor { animation: cursor-blink 1.05s steps(1, end) infinite; }
    .pulse-ring { transform-box: fill-box; transform-origin: center; animation: node-pulse 2.5s ease-out infinite; }
    .pulse-delay { animation-delay: 1.2s; }
    .node-core { animation: core-breathe 1.8s ease-in-out infinite; }
    .status { animation: status-breathe 2.2s ease-in-out infinite; }
    .underline { animation: underline-scan 2.8s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .signal, .cursor, .pulse-ring, .node-core, .status, .underline { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16384A"/>
      <stop offset="0.48" stop-color="#37E8E2"/>
      <stop offset="1" stop-color="#9AFFB4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#43F0E7" stroke-opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g>
    <rect width="1200" height="320" rx="18" fill="#050B14"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <path class="signal" d="M0 256H167L204 219H335L374 258H492" stroke="#43F0E7" stroke-opacity="0.28"/>
    <path class="signal signal-reverse" d="M1200 78H1060L1018 120H925L887 82H802" stroke="#9AFFB4" stroke-opacity="0.28"/>
    <path d="M0 66H129L161 98H294" stroke="#43F0E7" stroke-opacity="0.1"/>
    <path d="M1200 272H1098L1066 240H936" stroke="#9AFFB4" stroke-opacity="0.1"/>

    <circle cx="28" cy="28" r="4" fill="#FF6B6B"/>
    <circle cx="44" cy="28" r="4" fill="#FFD166"/>
    <circle cx="60" cy="28" r="4" fill="#8BFFB0"/>
    <text x="82" y="33" fill="#64748B" font-family="DejaVu Sans Mono, monospace" font-size="12" letter-spacing="1.6">PROFILE.SYS / BUILD 2026.08</text>
    <text class="status" x="1118" y="33" fill="#8BFFB0" font-family="DejaVu Sans Mono, monospace" font-size="11" text-anchor="end">● ONLINE</text>

    <text x="58" y="129" fill="#E6FAFF" font-family="DejaVu Sans Mono, monospace" font-size="48" font-weight="700">TiantianTitan</text>
    <rect class="underline" x="58" y="149" width="486" height="2" fill="url(#edge)" filter="url(#glow)"/>
    <text x="58" y="182" fill="#43F0E7" font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2.2">FULL-STACK DEVELOPER // PRODUCT ENGINEER</text>
    <text x="58" y="218" fill="#8095A8" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.2">WEB · MOBILE · DATA · PLATFORM · AUTOMATION</text>
    <rect class="cursor" x="474" y="207" width="8" height="14" fill="#8BFFB0"/>

    <g font-family="DejaVu Sans Mono, monospace" font-size="13">
      <text x="750" y="113" fill="#64748B">$ system.identity</text>
      <text x="750" y="139" fill="#D7F9F5">FREELANCE / INDEPENDENT</text>
      <text x="750" y="181" fill="#64748B">$ system.scope</text>
      <text x="750" y="207" fill="#D7F9F5">BUILD / MAINTAIN / OPERATE</text>
      <text x="750" y="249" fill="#64748B">$ system.status</text>
      <text x="750" y="275" fill="#8BFFB0">READY_TO_SHIP</text>
    </g>

    <g fill="none" stroke="#43F0E7">
      <circle class="node-core" cx="688" cy="113" r="4" fill="#43F0E7" filter="url(#glow)"/>
      <circle class="pulse-ring" cx="688" cy="113" r="18" opacity="0.16"/>
      <circle class="node-core" cx="1129" cy="274" r="3" fill="#9AFFB4" stroke="#9AFFB4" filter="url(#glow)"/>
      <circle class="pulse-ring pulse-delay" cx="1129" cy="274" r="14" stroke="#9AFFB4" opacity="0.14"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" stroke="url(#edge)" stroke-opacity="0.7" stroke-width="2"/>
</svg>
